# Banco H2 em memória: não precisa instalar nada (os dados somem ao parar o programa)
spring.datasource.url=jdbc:h2:mem:tarefasdb
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria a tabela "tarefas" sozinho a partir da classe Tarefa
spring.jpa.hibernate.ddl-auto=create-drop

# Console do banco (opcional): http://localhost:8080/h2-console
spring.h2.console.enabled=true
